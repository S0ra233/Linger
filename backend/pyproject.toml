[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-server"
version = "0.1.0"
description = "独立 RP 系统服务端"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "cryptography>=44,<50",
  "tzdata>=2025.1",
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
  "mcp>=1.26,<2",
  "jsonschema>=4.20,<5",
]

[project.scripts]
rp-server = "rp_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rp_server = ["static/**/*"]
